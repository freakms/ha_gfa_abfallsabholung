name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create release zip
        run: |
          cd custom_components
          zip -r "../ha_gfa_abfallsabholung-${GITHUB_REF_NAME}.zip" gfa_abfallkalender/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "GFA Abfallkalender ${{ github.ref_name }}"
          body: |
            ## Änderungen
            **Full Changelog**: https://github.com/${{ github.repository }}/compare/v${{ steps.version.outputs.version }}...HEAD
          files: "ha_gfa_abfallsabholung-${{ github.ref_name }}.zip"
          generate_release_notes: true
